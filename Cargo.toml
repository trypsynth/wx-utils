[package]
name = "wx-utils"
version = "0.4.3"
description = "Utilities to ease development of cross-platform desktop apps with wxDragon."
license = "MIT"
readme = "README.md"
repository = "https://github.com/trypsynth/wx-utils"
keywords = ["wxdragon", "desktop", "utility"]
categories = ["accessibility", "gui", "localization"]
edition = "2024"

[package.metadata.patois]
translatable = true

[features]
shortcuts = ["dep:live-region", "dep:key-chord"]
global-hotkeys = ["dep:key-chord", "dep:windows"]

[dependencies]
key-chord = { version = "0.2.2", optional = true }
live-region = { version = "0.3.3", optional = true }
patois = "0.2.3"
wxdragon = { version = "0.9.22", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
	"Win32_Foundation",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }
