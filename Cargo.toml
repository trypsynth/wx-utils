[package]
name = "wx-utils"
version = "0.3.1"
description = "Utilities to ease development of cross-platform desktop apps with wxDragon."
license = "MIT"
readme = "README.md"
repository = "https://github.com/trypsynth/wx-utils"
keywords = ["wxdragon", "desktop", "utility"]
categories = ["accessibility", "gui", "localization"]
edition = "2024"

[package.metadata.patois]
translatable = true

[features]
shortcuts = ["dep:live-region", "dep:key-chord"]

[dependencies]
key-chord = { version = "0.1.0", optional = true }
live-region = { version = "0.3.0", optional = true }
patois = "0.2.1"
# default-features = false so this does not decide for the application
# which parts of wxWidgets get built; nothing here needs any of them.
wxdragon = { version = "0.9.22", default-features = false }
